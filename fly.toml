# fly.toml app configuration file generated for babyone on 2026-05-12T00:57:09-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'babyone'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  BABYONE_DB = '/data/data.db'
  PORT = '8080'
  ANTHROPIC_MODEL = 'claude-sonnet-5'

[[mounts]]
  source = 'babyone_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
